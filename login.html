<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lima - Command Center Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "var(--surface)",
                        "surface-container": "var(--surface-container)",
                        "surface-variant": "var(--surface-variant)",
                        "on-surface": "var(--on-surface)",
                        "on-surface-variant": "var(--on-surface-variant)",
                        "primary": "var(--primary)",
                        "on-primary": "var(--on-primary)",
                        "secondary": "var(--secondary)",
                        "tertiary": "var(--tertiary)",
                        "danger-rose": "#f43f5e",
                        "success-emerald": "#10b981",
                        "background": "var(--surface)",
                        "on-background": "var(--on-surface)",
                        "gradient-start": "var(--gradient-start)",
                        "gradient-end": "var(--gradient-end)",
                        "glass-bg": "var(--glass-bg)",
                        "glass-border": "var(--glass-border)",
                        "sidebar-bg": "var(--sidebar-bg)"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "h1": ["Space Grotesk", "sans-serif"],
                        "h2": ["Space Grotesk", "sans-serif"],
                        "h3": ["Space Grotesk", "sans-serif"],
                        "body-lg": ["Geist", "sans-serif"],
                        "body-md": ["Geist", "sans-serif"],
                        "label": ["Geist", "sans-serif"],
                        "code": ["Geist", "monospace"]
                    }
                }
            }
        }
    </script>
    <link rel="icon" type="image/png" href="LIMA_Logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 selection:bg-primary/30 selection:text-primary relative overflow-hidden font-body-md">
    <!-- WebGL Canvas Shader -->
    <canvas id="glcanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <div class="w-full max-w-md glass-panel p-8 md:p-10 z-10 relative stagger-enter border border-glass-border shadow-2xl">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary/10 border border-primary/40 p-2 mb-4 overflow-hidden">
                <img src="LIMA_Logo.png" alt="Lima Logo" class="w-full h-full object-contain" />
            </div>
            <h1 class="font-h1 text-3xl uppercase tracking-tight text-primary">Lima</h1>
            <p class="text-xs uppercase tracking-widest text-on-surface-variant mt-1">Authenticate to access system</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <!-- Error message banner -->
            <div id="loginError" class="text-xs text-danger-rose text-center min-h-[1.25rem] font-mono"></div>

            <!-- Username Input -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-on-surface-variant mb-1.5 font-semibold">Username</label>
                <div class="flex items-center bg-surface-container/60 border border-glass-border focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
                    <span class="material-symbols-outlined text-on-surface-variant/60 text-xl pl-3 pr-2">person</span>
                    <input type="text" id="username" class="w-full bg-transparent border-none text-on-surface text-sm p-3 focus:ring-0 outline-none placeholder:text-on-surface-variant/40" placeholder="Enter your username" required autofocus />
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-on-surface-variant mb-1.5 font-semibold">Password</label>
                <div class="flex items-center bg-surface-container/60 border border-glass-border focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
                    <span class="material-symbols-outlined text-on-surface-variant/60 text-xl pl-3 pr-2">lock</span>
                    <input type="password" id="password" class="w-full bg-transparent border-none text-on-surface text-sm p-3 focus:ring-0 outline-none placeholder:text-on-surface-variant/40" placeholder="Enter your password" required />
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="login-btn brutalist-button w-full bg-primary text-on-primary font-bold text-xs uppercase tracking-widest py-3.5 mt-2 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span>Access System</span>
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-glass-border/30 text-xs text-on-surface-variant">
            Need an authorized account?
            <a href="signup.html" class="text-primary font-bold hover:underline ml-1">Initialize Account</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
