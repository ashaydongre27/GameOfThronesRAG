<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <button id="homeBtn" class="sidebar-icon active" title="Home">
                <i class="fas fa-home"></i>
                <span class="sidebar-text">Home</span>
            </button>
            <button id="logoutBtn" class="sidebar-icon logout" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
                <span class="sidebar-text">Logout</span>
            </button>
        </aside>
        <div class="main-container">
            <header>
                <div class="header-title">
                    <h1 id="viewTitle">Home</h1>
                    <span id="ragContextLabel" class="rag-label hidden"></span>
                </div>
                <button id="settingsBtn" class="icon-btn" title="Settings">
                    <i class="fas fa-cog"></i>
                </button>
            </header>
            <main id="homeView" class="view-area">
                <div class="rag-grid" id="ragGrid">
                </div>
            </main>
            <main id="chatView" class="view-area hidden">
                <div id="chatArea" class="chat-area">
                    <div class="message bot">
                        <div class="message-content">Select a knowledge base from the home page to start asking
                            questions.</div>
                    </div>
                </div>
                <footer class="input-area">
                    <textarea id="userInput" placeholder="Ask a question..." rows="1"></textarea>
                    <button id="sendBtn" class="send-btn" title="Send">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </footer>
            </main>
        </div>
    </div>
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="closeSettingsBtn" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <h3>Appearance Profiles</h3>
                    <div class="setting-item">
                        <select id="themeProfile">
                            <option value="light">Light</option>
                            <option value="dark">Dark Contrast</option>
                            <option value="midnight">Midnight</option>
                            <option value="cosmic">Cosmic Purple</option>
                            <option value="ocean">Deep Ocean</option>
                            <option value="sunset">Sunset Fire</option>
                            <option value="forest">Forest</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    <div class="color-pickers">
                        <div class="setting-item" style="flex: 1;">
                            <label for="color1">Color 1</label>
                            <input type="color" id="color1" value="#6a11cb">
                        </div>
                        <div class="setting-item" style="flex: 1;">
                            <label for="color2">Color 2</label>
                            <input type="color" id="color2" value="#2575fc">
                        </div>
                    </div>
                </div>
                <div class="settings-group">
                    <h3>Model Parameters</h3>
                    <div class="setting-item">
                        <label for="usermodel">Model Name</label>
                        <select id="usermodel">
                            <option value="gemma4:31b-cloud">gemma4:31b</option>
                            <option value="nemotron-3-nano:30b-cloud">nemotron-3-nano</option>
                            <option value="gpt-oss:20b-cloud">gpt-oss</option>
                            <option value="gemma:2b">Gemma 2B</option>
                            <option value="phi3:mini">Phi-3 Mini</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="usertemperature">Temperature (<span id="tempVal">0.5</span>)</label>
                        <input type="range" id="usertemperature" min="0" max="1" step="0.1" value="0.5">
                    </div>
                </div>
                <div class="settings-group">
                    <h3>Vector Search Parameters</h3>
                    <div class="setting-item">
                        <label for="umatch_count">Match Count</label>
                        <input type="number" id="umatch_count" value="10" min="1" max="20">
                    </div>
                    <div class="setting-item">
                        <label for="umatch_threshold">Match Threshold (<span id="threshVal">0.4</span>)</label>
                        <input type="range" id="umatch_threshold" min="0" max="1" step="0.05" value="0.4">
                    </div>
                </div>
                <div class="settings-group">
                    <h3>System Prompt</h3>
                    <div class="setting-item">
                        <textarea id="sysprompt" rows="4">You are a helpful assistant. Use the following context to answer the user's question. 
If you don't know the answer based on the context, just say that you don't know.</textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSettingsBtn" class="primary-btn">Save & Apply</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
