<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lima - Account Registration</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#0b1326",
                        "surface-dim": "#0b1326",
                        "surface-bright": "#31394d",
                        "surface-container-lowest": "#060e20",
                        "surface-container-low": "#131b2e",
                        "surface-container": "#171f33",
                        "surface-container-high": "#222a3d",
                        "surface-container-highest": "#2d3449",
                        "surface-variant": "#2d3449",
                        "on-surface": "#dae2fd",
                        "on-surface-variant": "#c2c6d6",
                        "primary": "#adc6ff",
                        "on-primary": "#002e6a",
                        "primary-container": "#4d8eff",
                        "secondary": "#a4c9ff",
                        "tertiary": "#4edea3",
                        "danger-rose": "#f43f5e",
                        "success-emerald": "#10b981",
                        "background": "#0b1326",
                        "on-background": "#dae2fd",
                        "gradient-start": "#0f172a",
                        "gradient-end": "#1e293b",
                        "glass-bg": "rgba(255, 255, 255, 0.04)",
                        "glass-border": "rgba(255, 255, 255, 0.15)",
                        "sidebar-bg": "rgba(0, 0, 0, 0.6)"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "h1": ["Space Grotesk", "sans-serif"],
                        "h2": ["Space Grotesk", "sans-serif"],
                        "h3": ["Space Grotesk", "sans-serif"],
                        "body-lg": ["Geist", "sans-serif"],
                        "body-md": ["Geist", "sans-serif"],
                        "label": ["Geist", "sans-serif"],
                        "code": ["Geist", "monospace"]
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 selection:bg-primary/30 selection:text-primary relative overflow-hidden font-body-md">
    <!-- WebGL Canvas Shader -->
    <canvas id="glcanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <div class="w-full max-w-lg glass-panel p-8 md:p-10 z-10 relative stagger-enter border border-glass-border shadow-2xl my-8">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-primary/10 border border-primary/40 text-primary mb-3">
                <span class="material-symbols-outlined text-3xl">person_add</span>
            </div>
            <h1 class="font-h1 text-2xl uppercase tracking-tight text-on-surface">Account Registration</h1>
            <p class="text-xs uppercase tracking-widest text-on-surface-variant mt-1">Register for persistent RAG chat history</p>
        </div>

        <form id="signupForm" class="space-y-4">
            <!-- Error banner -->
            <div id="signupError" class="text-xs text-danger-rose text-center min-h-[1.25rem] font-mono"></div>

            <!-- Name Inputs -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-on-surface-variant mb-1 font-semibold">First Name</label>
                    <div class="flex items-center bg-surface-container/60 border border-glass-border focus-within:border-primary transition-all">
                        <input type="text" id="first_name" class="w-full bg-transparent border-none text-on-surface text-sm p-2.5 focus:ring-0 outline-none placeholder:text-on-surface-variant/40" placeholder="First Name" required />
                    </div>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-on-surface-variant mb-1 font-semibold">Last Name</label>
                    <div class="flex items-center bg-surface-container/60 border border-glass-border focus-within:border-primary transition-all">
                        <input type="text" id="last_name" class="w-full bg-transparent border-none text-on-surface text-sm p-2.5 focus:ring-0 outline-none placeholder:text-on-surface-variant/40" placeholder="Last Name" required />
                    </div>
                </div>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-on-surface-variant mb-1 font-semibold">Email Address</label>
                <div class="flex items-center bg-surface-container/60 border border-glass-border focus-within:border-primary transition-all">
                    <span class="material-symbols-outlined text-on-surface-variant/60 text-lg pl-3 pr-1">mail</span>
                    <input type="email" id="email" class="w-full bg-transparent border-none text-on-surface text-sm p-2.5 focus:ring-0 outline-none placeholder:text-on-surface-variant/40" placeholder="user@domain.com" required />
                </div>
            </div>

            <!-- Username -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-on-surface-variant mb-1 font-semibold">Username</label>
                <div class="flex items-center bg-surface-container/60 border border-glass-border focus-within:border-primary transition-all">
                    <span class="material-symbols-outlined text-on-surface-variant/60 text-lg pl-3 pr-1">badge</span>
                    <input type="text" id="username" class="w-full bg-transparent border-none text-on-surface text-sm p-2.5 focus:ring-0 outline-none placeholder:text-on-surface-variant/40" placeholder="Unique username" required />
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-on-surface-variant mb-1 font-semibold">Password</label>
                <div class="flex items-center bg-surface-container/60 border border-glass-border focus-within:border-primary transition-all">
                    <span class="material-symbols-outlined text-on-surface-variant/60 text-lg pl-3 pr-1">lock</span>
                    <input type="password" id="password" class="w-full bg-transparent border-none text-on-surface text-sm p-2.5 focus:ring-0 outline-none placeholder:text-on-surface-variant/40" placeholder="Create strong password" required />
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="login-btn brutalist-button w-full bg-primary text-on-primary font-bold text-xs uppercase tracking-widest py-3.5 mt-3 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span>Create Authorized Account</span>
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-glass-border/30 text-xs text-on-surface-variant">
            Already have credentials?
            <a href="login.html" class="text-primary font-bold hover:underline ml-1">Log in here</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
